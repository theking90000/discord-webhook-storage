[package]
name = "discord-webhook-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["theking90000 <martin.cogh@gmail.com>"]
description = "Stream file uploads to Discord webhooks over async I/O"
license = "MIT"
repository = "https://github.com/theking90000/discord-webhook-storage"
documentation = "https://docs.rs/discord-webhook-storage"
readme = "README.md"
keywords = ["webhook", "discord"]
categories = ["asynchronous", "network-programming"]
include = [
    "/src",
    "/tests",
    "/benches",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/Cargo.toml",
]

[features]
default = []
tokio-tcp-pool = ["dep:tokio-tcp-pool"]

[dependencies]
futures = "0.3.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio-tcp-pool = { version = "0.1.3", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
webpki-roots = "1.0"

[[example]]
name = "webhook_upload"
required-features = ["tokio-tcp-pool"]

[[example]]
name = "webhook_upload_download"
required-features = ["tokio-tcp-pool"]

[[example]]
name = "webhook_upload_renew"
required-features = ["tokio-tcp-pool"]

[[example]]
name = "webhook_parallel_upload_renew_download"
required-features = ["tokio-tcp-pool"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
